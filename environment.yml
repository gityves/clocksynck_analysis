# conda env create -f environment.yml && conda activate sccc   (run from the repository root)
# Julia 1.6.7 + CYCLOPS 2.0 and pychiral are installed separately under $SCCC_DATA/tools (benchmark only).
name: sccc
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - torch==2.9.1
      - -e ../CoPhaser          # CoPhaser, not modified (benchmark and cell-phase comparisons)
      - -e ../paperfig          # figure layout helpers
      - -e ./clocksync[plot]    # the method
